[DiscordPortable]
AdditionalParameters=
UpdateCheck=true
Architecture=auto
ClientMod=none

# UpdateCheck=
; Check for a new Discord at start and offer to update. On ARM64 Windows it
; also offers the ARM64 build when the package doesn't have it. Discord keeps
; updating its own modules either way.

# Architecture= (auto, x64, arm64)
; Which build to run. auto picks the one that runs natively: ARM64 on
; Windows on ARM when the package has it, x64 everywhere else.

# ClientMod= (none, BetterDiscord, Vencord, Equicord)
; Load a client mod into Discord: BetterDiscord (https://betterdiscord.app),
; Vencord (https://vencord.dev) or Equicord (https://equicord.org). It is
; downloaded the first time and updates itself after that. Its plugins,
; themes and settings are kept in Data\BetterDiscord, Data\Vencord or
; Data\Equicord. Set it back to none to run Discord
; without one. Older copies used BetterDiscord=true, which still works when
; ClientMod= isn't set.

# AdditionalParameters=
; Pass additional command-line switches.
