[DiscordPortable]
AdditionalParameters=
UpdateCheck=true
Architecture=auto
BetterDiscord=false

# UpdateCheck=
; Check for a new Discord at start and offer to update. On ARM64 Windows it
; also offers the ARM64 build when the package doesn't have it. Discord keeps
; updating its own modules either way.

# Architecture= (auto, x64, arm64)
; Which build to run. auto picks the one that runs natively: ARM64 on
; Windows on ARM when the package has it, x64 everywhere else.

# BetterDiscord=
; Load BetterDiscord (https://betterdiscord.app) into Discord. It is
; downloaded the first time, and its plugins, themes and settings are kept in
; Data\BetterDiscord. Set it back to false to run Discord without it.

# AdditionalParameters=
; Pass additional command-line switches.
