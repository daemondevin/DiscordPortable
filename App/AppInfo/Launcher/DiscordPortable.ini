[Launch]
; The executable is picked at run time: the newest app-<version> folder of
; the build that runs (App\Discord for x64, App\DiscordARM64 for ARM64), so
; versions Discord installs for itself start too. This is only the fallback.
ProgramExecutable=Discord\Discord.exe
DirectoryMoveOK=yes
SupportsUNC=no
MinOS=10
; An installed Discord that is running would share its data folder with
; this one, so the launch stops when one is open.
SingleAppInstance=true
; A second launch hands its parameters (a discord:// link, for example) to
; the running Discord, which brings its window to the front.
SinglePortableAppInstance=false

[Activate]
Symlinks=true

; Discord keeps its settings and sign-in in %APPDATA%\discord, and
; BetterDiscord looks for its folder next to it. Both are linked into Data
; while Discord runs, so nothing is copied back and forth. A real folder
; already in either place (from an installed Discord) is moved aside for the
; session and put back afterwards.
[Symlink1]
Type=junction
Source=AppData\discord
Target=%APPDATA%\discord

[Symlink2]
Type=junction
Source=BetterDiscord
Target=%APPDATA%\BetterDiscord
